name: Release Binaries
on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Pinned rather than `ubuntu-latest`: glibc is only backward compatible, so the binary
          # runs on the build image's release and newer, never older. 22.04 is the oldest release
          # we support, and building there is what makes the result run everywhere above it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
        #   - os: macos-latest
        #     target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Ahead of the build so a failure stops the release before any artifact is uploaded.
      - name: Run tests
        run: cargo test --verbose
      - name: Run Build
        run: cargo build --release --target ${{ matrix.target }} --verbose
      # `upload-artifact` zips its inputs and drops the Unix mode bits, so an uploaded binary
      # arrives without its executable bit. Tarring first carries the mode through ourselves.
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf ev_peak_gui-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ev_peak_gui
      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ev_peak_gui-${{ matrix.target }}.tar.gz
      # No tarball on Windows: nothing there depends on a permission bit surviving the trip.
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ev_peak_gui.exe



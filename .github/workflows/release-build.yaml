name: Release Binaries
on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
        #   - os: macos-latest
        #     target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run Build
        run: cargo build --release --target ${{ matrix.target }} --verbose
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          # All three binaries: the desktop app, and the two command-line tools. The `.exe` and
          # bare names are both listed because one matrix entry produces each; `if-no-files-found:
          # ignore` is what lets the other be absent.
          path: |
            target/${{ matrix.target }}/release/ev_peak_gui
            target/${{ matrix.target }}/release/ev_peak_gui.exe
            target/${{ matrix.target }}/release/ev_peak_cli
            target/${{ matrix.target }}/release/ev_peak_cli.exe
            target/${{ matrix.target }}/release/ev_csv_to_xlsx
            target/${{ matrix.target }}/release/ev_csv_to_xlsx.exe
          if-no-files-found: ignore
      - name: Run tests
        run: cargo test --verbose


